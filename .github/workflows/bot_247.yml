name: 24/7 FeaturesticLeaks Telegram Bot Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  repository_dispatch:
    types: [ restart_bot ]

jobs:
  run-247-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libzstd-dev

      - name: Install Required Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install rich requests pytz gmalg pycryptodome zstandard

      - name: Run 24/7 Telegram Bot Service
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          python3 bot_runner.py

      - name: Trigger Continuous Loop Dispatch
        if: always()
        env:
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "🔄 Job finished or 5h 50m limit reached. Triggering next GitHub Action runner loop..."
          if [ -n "$GH_PAT_TOKEN" ]; then
            curl -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token $GH_PAT_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/dispatches \
              -d '{"event_type": "restart_bot"}'
          else
            echo "⚠️ GH_PAT_TOKEN secret not set! Auto-dispatch loop requires GH_PAT_TOKEN secret in GitHub Repo."
          fi
